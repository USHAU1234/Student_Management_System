<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Management</title>
</head>
<body>
<h1>Student List</h1>
<table border="1">
    <tr>
        <th>ID</th><th>Name</th><th>Email</th>
    </tr>
    <tr th:each="student : ${students}">
        <td th:text="${student.id}"></td>
        <td th:text="${student.name}"></td>
        <td th:text="${student.email}"></td>
<td>
        <a th:href="@{'/students-ui/edit/' + ${student.id}}">✏ Edit</a> |
        <a th:href="@{'/students-ui/delete/' + ${student.id}}">🗑 Delete</a>
    <a th:href="@{'/students-ui/update/' + ${student.id}}">🗑 Update</a>
</td>
    </tr>
</table>
</body>
</html>
